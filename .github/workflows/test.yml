# Generated by the authoritative private repository's sanitized public-mirror export.
name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  symbolic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: sudo apt-get update && sudo apt-get install -y z3 cvc5
      - run: forge test --symbolic --match-path 'test/symbolic/*.t.sol' --symbolic-solver-portfolio z3,cvc5 --symbolic-timeout 60 -vv
